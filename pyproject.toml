[build-system]
requires = ["setuptools>=84,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "maintbot"
version = "0.1.0"
description = "Telegram bot that displays monitoring data from Zabbix and manages maintenance, tickets, broadcasts."
requires-python = ">=3.10"
dependencies = [
    "python-telegram-bot[job-queue]==22.8",
    "python-dotenv==1.2.3",
    "httpx==0.28.1",
    "h11==0.16.0",
    "openpyxl==3.1.5",
    "pydantic==2.13.5",
    "tzdata==2026.3",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.16.7",
    "mypy==2.3.1",
    "bandit==1.9.4",
    "pip-audit==2.10.1",
    "vulture==2.16",
    "types-openpyxl==3.1.5.20260827",
]

[project.scripts]
maintbot = "app.launcher:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.setuptools.package-data]
"app.captcha" = ["static/index.html", "static/app.css", "static/app.js"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM"]
# SIM108: принудительные тернарники на длинных выражениях читаются хуже if/else
ignore = ["SIM108"]

[tool.mypy]
python_version = "3.10"
files = ["app"]
